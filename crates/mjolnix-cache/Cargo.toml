[package]
name = "mjolnix-cache"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
mjolnix-shared = { path = "../mjolnix-shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "net",
  "process",
  "rt-multi-thread",
] }
